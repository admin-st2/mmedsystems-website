# Owner approved publication of these public marketing pages and illustrations.
# The archive contains no private demo, credentials, personal records or backend code.
# Its SHA256 is enforced by the importer; this temporary workflow is removed before release.
name: Approved MMeD sector release - import and validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/prepare_approved_sector_release.py'
      - 'scripts/verify_sector_release.py'
      - 'scripts/sector_release_browser.py'
      - '.github/workflows/approved-sector-import.yml'
permissions:
  contents: write
jobs:
  import-approved-source:
    if: github.head_ref == 'release/approved-sectors-2026-11-07' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import reviewed public website source (SHA256 verified)
        env:
          MMED_APPROVED_SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8270-81f5-9ed9-02922a6c22bf/raw?se=2026-11-07T23%3A00%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=bdc322f5-a1ed-5a76-aa31-7651490e4900&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A33%3A15Z&ske=2026-11-08T00%3A33%3A15Z&sks=b&skv=2026-02-06&sig=6xGx6lf42ndY5zC7r3ncB3GoQPEI1z8IL5jo5Js1OFY%3D'
        run: |
          python -m pip install beautifulsoup4==4.14.2
          python scripts/prepare_approved_sector_release.py
      - name: Verify all 47 routes, booking preservation and search settings
        run: python scripts/verify_sector_release.py
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test imported source
        env:
          MMED_TEST_BROWSERS: chromium,firefox,webkit
        run: python scripts/sector_release_browser.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmed-sector-release-qa-${{ github.run_id }}
          path: |
            sector-release-qa/
            docs/releases/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit validated public source to release branch only
        run: |
          test "$GITHUB_HEAD_REF" = release/approved-sectors-2026-11-07
          git fetch origin main
          test "$(git rev-parse origin/main)" = 521d6a0c3d2dde978e3fa29954b3c97f9c8bcc6a
          git config user.name 'MMeD Website Release'
          git config user.email '163439386+admin-st2@users.noreply.github.com'
          rm -rf sector-release-qa
          git restore .github/workflows/website-checks.yml
          git add -- '*.html' '*.css' '*.js' '*.svg' '*.webp' robots.txt sitemap.xml docs/releases scripts/verify_site.py scripts/browser_smoke.py scripts/verify_sector_release.py scripts/sector_release_browser.py
          git commit -m 'Import approved 22-sector public website; keep booking and search safeguards'
          git push origin HEAD:refs/heads/release/approved-sectors-2026-11-07
          echo "VALIDATED_RELEASE_HEAD=$(git rev-parse HEAD)"
