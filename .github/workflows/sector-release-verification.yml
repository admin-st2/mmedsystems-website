name: MMeD sector release verification
on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'sitemap.xml'
      - 'scripts/verify_sector_release.py'
      - 'scripts/sector_release_browser.py'
      - 'scripts/verify_sector_live.py'
      - '.github/workflows/sector-release-verification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/releases/sectors-2026-11-07.json'
  workflow_dispatch:
    inputs:
      notify_indexnow:
        type: boolean
        default: false
        description: 'Notify once after a meaningful published change; receipts do not prove indexing.'
permissions:
  contents: read
jobs:
  sector-source-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every public route and compile release checks
        run: |
          python scripts/verify_sector_release.py
          python -m py_compile scripts/verify_sector_live.py scripts/sector_release_browser.py
          test ! -f scripts/prepare_approved_sector_release.py
          test ! -f .github/workflows/approved-sector-import.yml
      - name: Install Firefox and WebKit (Chromium covered by corporate browser checks)
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps firefox webkit
      - name: Validate representative routes and key journeys in other browser engines
        env:
          MMED_TEST_BROWSERS: firefox,webkit
        run: python scripts/sector_release_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmed-cross-browser-${{ github.run_id }}
          path: sector-release-qa/results.json
          retention-days: 30
          if-no-files-found: warn
  verify-published-release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact live release before notifying search engines
        env:
          NOTIFY: ${{ (github.event_name == 'push' || inputs.notify_indexnow) && github.run_attempt == 1 }}
        run: |
          if test "$NOTIFY" = true; then
            python3 scripts/verify_sector_live.py --notify-indexnow
          else
            python3 scripts/verify_sector_live.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmed-live-release-${{ github.run_id }}
          path: live-release-report/
          retention-days: 90
          if-no-files-found: warn
