name: MMeD staging readiness — no production deploy
on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
    paths:
      - 'scripts/build_private_staging.py'
      - 'scripts/test_private_staging.py'
      - '.github/workflows/staging-readiness.yml'
      - 'docs/staging-setup.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local staging does not expose site before Cloudflare Access
        run: python3 -m unittest discover -s scripts -p test_private_staging.py -v
      - name: Verify default build exports only placeholder
        run: |
          python3 scripts/build_private_staging.py
          test -f dist-staging/index.html
          test ! -f dist-staging/where-we-serve/index.html
          test ! -f dist-staging/CNAME
          grep -q 'Private staging is not active' dist-staging/index.html
      - name: Confirm only staging is checked (never production main)
        run: |
          if test "$GITHUB_EVENT_NAME" = "pull_request"; then
            test "$GITHUB_BASE_REF" = staging
          else
            test "$GITHUB_REF_NAME" = staging
          fi
          echo 'Stage preparation only; Cloudflare Access and explicit activation still required.'

  staging-visual-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture proposed staging layouts only
        run: python scripts/capture_visual_review.py
      - name: Publish review artifact, not a website deployment
        uses: actions/upload-artifact@v4
        with:
          name: mmed-tlc-staging-preview-${{ github.event.pull_request.number }}
          path: visual-review/
          retention-days: 14
          if-no-files-found: error
      - name: Review instructions
        run: |
          echo '## Review before approval' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the staging preview ZIP from **Artifacts**; open index.html to compare desktop/mobile layouts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'These screenshots are rendered locally from proposed source; **no change to production has been published.**' >> "$GITHUB_STEP_SUMMARY"
