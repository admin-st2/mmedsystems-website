name: MMeD homepage approach links
on:
  pull_request:
    branches: [main]
    paths: ['scripts/approach_strip.py', '.github/workflows/approach-strip.yml', 'index.html', 'homepage-approach.css']
  push:
    branches: [main]
    paths: ['scripts/approach_strip.py', '.github/workflows/approach-strip.yml', 'index.html', 'homepage-approach.css']
permissions:
  contents: read
jobs:
  approach-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify the scoped strip and website integrity
        run: |
          python scripts/approach_strip.py
          python scripts/verify_sector_release.py
      - name: Install browser engines
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Check links, keyboard focus, no-JS navigation and responsive layout
        env:
          MMED_TEST_BROWSERS: chromium,firefox,webkit
        run: python scripts/approach_strip.py --browser
      - name: Preserve screenshots and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmed-approach-links-${{ github.run_id }}
          path: approach-strip-qa/
          if-no-files-found: warn
          retention-days: 14
  approach-published:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify public homepage, exact stylesheet and all three destinations
        run: python3 scripts/approach_strip.py --live
      - name: Save deployment verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmed-approach-live-${{ github.run_id }}
          path: approach-strip-qa/
          if-no-files-found: warn
          retention-days: 30
