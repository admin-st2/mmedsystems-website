name: MMeD FAQ — browser and accessibility review
on:
  pull_request:
    branches: [main]
    paths:
      - 'faq/**'
      - 'mmed-v6.css'
      - 'scripts/faq_browser_check.py'
      - '.github/workflows/faq-review.yml'
      - 'sitemap.xml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faq-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install supported Chromium test browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Test FAQ interactions and footer navigation
        run: python scripts/faq_browser_check.py
      - name: Upload review screenshots and results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmed-faq-review-${{ github.event.pull_request.number }}
          path: faq-review/
          retention-days: 14
          if-no-files-found: error
