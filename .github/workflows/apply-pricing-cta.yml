name: Prepare homepage Pricing CTA - branch only
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pricing_cta_update.py'
      - '.github/workflows/apply-pricing-cta.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'fix/pricing-homepage-cta-2026-11-07' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile the latest approved navigation then apply the pricing update
        run: |
          test "$(git rev-parse origin/main)" = 0a902bea1bac3c74cb0b578e00dc77d522dcb9f4
          git config user.name 'MMeD Website Release'
          git config user.email '163439386+admin-st2@users.noreply.github.com'
          git merge --no-edit origin/main
          python scripts/pricing_cta_update.py --apply
          python scripts/verify_sector_release.py
      - name: Install browser for interaction tests
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Check CTA navigation, keyboard use and responsive layout
        run: python scripts/pricing_cta_update.py --browser
      - name: Retain screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmed-pricing-cta-${{ github.run_id }}
          path: pricing-cta-qa/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit validated website edits to this branch, not main
        run: |
          test "$GITHUB_HEAD_REF" = fix/pricing-homepage-cta-2026-11-07
          git fetch origin main
          test "$(git rev-parse origin/main)" = 0a902bea1bac3c74cb0b578e00dc77d522dcb9f4
          git add -u -- '*.html'
          git add homepage-pricing.css
          git commit -m 'Replace header Pricing links with a responsive homepage pricing CTA'
          git push origin HEAD:refs/heads/fix/pricing-homepage-cta-2026-11-07
