name: MMeD buttons and navigation — private review
on:
  pull_request:
    branches: [spacing/compact-responsive-review-2026-11-06]
    paths:
      - 'mmed-v6.css'
      - 'mmed-v6.js'
      - '**/*.html'
      - 'scripts/review_buttons_navigation.py'
      - '.github/workflows/buttons-navigation-review.yml'
permissions:
  contents: read
jobs:
  review-interactions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Test actual buttons and navigation at four viewports
        run: python scripts/review_buttons_navigation.py
      - name: Provide owner screenshots without publishing any page
        uses: actions/upload-artifact@v4
        with:
          name: mmed-buttons-navigation-pr-${{ github.event.pull_request.number }}
          path: navigation-ux-review/
          if-no-files-found: error
          retention-days: 14
      - name: Review guide
        run: |
          echo '## MMeD buttons/navigation review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the ZIP artifact from this run, unzip, then open **index.html**.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All previews are from the PR branch only. Production and secured staging are unchanged.' >> "$GITHUB_STEP_SUMMARY"
