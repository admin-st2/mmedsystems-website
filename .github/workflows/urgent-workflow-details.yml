name: MMeD Urgent Care workflow details
on:
  pull_request:
    branches: [main]
    paths:
      - 'urgent-care/**'
      - 'scripts/urgent_workflow_details.py'
      - '.github/workflows/urgent-workflow-details.yml'
      - 'sector-pages.css'
      - 'mmed-v6.css'
  push:
    branches: [main]
    paths:
      - 'urgent-care/**'
      - 'scripts/urgent_workflow_details.py'
      - '.github/workflows/urgent-workflow-details.yml'
permissions:
  contents: read
jobs:
  workflow-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scoped source, canonical routes and preserved boundaries
        run: |
          python scripts/urgent_workflow_details.py
          python scripts/verify_sector_release.py
      - name: Install test browser engines
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Validate disclosures, focus, phones and no-JavaScript operation
        env:
          MMED_TEST_BROWSERS: chromium,firefox,webkit
        run: python scripts/urgent_workflow_details.py --browser
      - name: Retain browser results and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmed-urgent-workflow-${{ github.run_id }}
          path: urgent-workflow-qa/
          retention-days: 14
          if-no-files-found: warn
  workflow-published:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact public workflow markup and stylesheet after deployment
        run: python3 scripts/urgent_workflow_details.py --live
      - name: Retain public-site verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmed-urgent-workflow-live-${{ github.run_id }}
          path: urgent-workflow-qa/
          retention-days: 30
          if-no-files-found: warn
