name: MMeD Urgent Care workflow details
on:
  pull_request:
    branches: [main]
    paths: ['scripts/urgent_workflow_details.py', '.github/workflows/urgent-workflow-details.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'ux/urgent-care-workflow-details-2026-11-07' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the Urgent Care workflow details
        run: |
          test "$(git rev-parse origin/main)" = 14bdb53f6c33ac88674fbba2ab3b09597c7a7bc3
          python scripts/urgent_workflow_details.py --apply
          python scripts/verify_sector_release.py
      - name: Install test browser engines
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test all seven disclosures and existing page journeys
        env:
          MMED_TEST_BROWSERS: chromium,firefox,webkit
        run: python scripts/urgent_workflow_details.py --browser
      - name: Retain browser results and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmed-urgent-workflow-${{ github.run_id }}
          path: urgent-workflow-qa/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit only the two tested public files to the review branch
        run: |
          test "$GITHUB_HEAD_REF" = ux/urgent-care-workflow-details-2026-11-07
          git fetch origin main
          test "$(git rev-parse origin/main)" = 14bdb53f6c33ac88674fbba2ab3b09597c7a7bc3
          git config user.name 'MMeD Website Release'
          git config user.email '163439386+admin-st2@users.noreply.github.com'
          git add urgent-care/index.html urgent-care/workflow-details.css
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Explain each Urgent Care workflow step with an accessible expandable card'
          git push origin HEAD:refs/heads/ux/urgent-care-workflow-details-2026-11-07
