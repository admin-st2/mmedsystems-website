name: MMeD corporate site checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate canonical URLs, navigation, metadata, and demo separation
        run: |
          python3 scripts/verify_site.py
          python3 scripts/verify_security.py
      - name: Verify public DNS, trusted HTTPS, and deployed routes
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_live_site.py

  browser-smoke:
    if: github.event_name != 'schedule'
    # Playwright 1.57 does not support the newer ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install public browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check public desktop and mobile navigation
        run: python scripts/browser_smoke.py
      - name: Test proposed headers locally (not production enforcement)
        run: python scripts/security_browser_check.py
      - name: Upload browser review screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmed-navigation-review-${{ github.run_id }}
          path: |
            security-review/
            navigation-review/
            sector-release-qa/results.json
          retention-days: 14
          if-no-files-found: warn
