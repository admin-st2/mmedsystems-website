name: MMeD corporate site checks
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'CNAME'
      - 'robots.txt'
      - '*.txt'
      - 'sitemap.xml'
      - 'scripts/verify_site.py'
      - '.github/workflows/website-checks.yml'
      - 'scripts/check_live_site.py'
      - 'scripts/browser_smoke.py'
      - 'scripts/navigation_booking_browser.py'
      - 'mmed-v6.css'
      - 'mmed-v6.js'
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical URLs, navigation, metadata, and demo separation
        run: python3 scripts/verify_site.py
      - name: Verify public DNS, trusted HTTPS, and deployed routes
        run: python3 scripts/check_live_site.py

  browser-smoke:
    if: github.event_name != 'schedule'
    # Playwright 1.57 does not support the newer ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check public desktop and mobile navigation
        run: python scripts/browser_smoke.py
      - name: Upload browser review screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmed-navigation-review-${{ github.run_id }}
          path: |
            navigation-review/
            sector-release-qa/results.json
          retention-days: 14
          if-no-files-found: warn
