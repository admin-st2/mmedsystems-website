name: MMeD corporate site checks
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'scripts/verify_site.py'
      - '.github/workflows/website-checks.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical URLs, navigation, metadata, and demo separation
        run: python3 scripts/verify_site.py
